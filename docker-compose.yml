# 一键部署编排（阶段三完善：后端 + 前端 + 数据/模型持久化卷 + 健康检查）
# 用法：docker compose up -d --build
version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # 数据（静态知识包 + 动态缓存 + Chroma + SQLite）持久化
      - ./backend/data:/app/data
      # embedding 模型缓存复用（宿主机已下载 bge-small-zh-v1.5，避免容器内重新下载）
      - ./backend/models:/app/models
    init: true                  # tini 收尸，避免 uvicorn 成为孤儿进程
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s         # 首次启动可能下载/加载 embedding 模型
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
