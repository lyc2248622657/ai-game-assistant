name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Static checks (ruff)
        working-directory: backend
        run: |
          ruff check app scripts tests --select F,E9,B --output-format concise

      - name: Data integrity (validate_data)
        working-directory: backend
        run: |
          python scripts/validate_data.py --game genshin
          python scripts/validate_data.py --game arknights

      - name: Retrieval regression (golden set)
        working-directory: backend
        # 不加载 embedding 模型，只跑名称+BM25；hit@5 低于 0.95 视为检索回归
        run: python scripts/eval/retrieval_eval.py --no-vector --k 5 --min-hit 0.95

      - name: Run pytest
        working-directory: backend
        run: |
          python -m pytest tests -q --tb=short

      - name: Verify RAG pipeline import
        working-directory: backend
        run: |
          python -c "from app.rag.retriever import hybrid_retrieve; print('RAG ok')"
          python -c "from app.agents.graph import build_graph; print('Graph ok')"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --force

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        working-directory: backend
        # Dockerfile 已改为在线 pip 安装，干净 checkout 即可构建
        # （离线 wheels 版本见 Dockerfile.offline，需要本地准备 backend/wheels/）
        run: |
          docker build -t ai-game-assistant-backend:ci .
          echo "backend image built OK"

      - name: Build frontend image
        working-directory: frontend
        run: |
          docker build -t ai-game-assistant-frontend:ci .
          echo "frontend image built OK"
